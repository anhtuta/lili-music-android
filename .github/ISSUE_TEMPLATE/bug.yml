name: Bug
description: Something in the Android listener does not match expected behaviour.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Include reproduction steps. Do not report Lumen backend bugs here unless the app mishandles a valid response.
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: "0.1.0 / abc123"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [blocker, major, minor, polish]
    validations:
      required: true
